[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardist-minimal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2", "timm>=1", "numpy>=1.24", "numba>=0.60", "scipy>=1.14", "scikit-image>=0.25"]

[tool.setuptools]
packages = ["stardist_minimal"]
