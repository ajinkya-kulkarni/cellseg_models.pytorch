[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardist-minimal"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2",
  "timm>=1",
  "numpy>=1.24",
  "numba>=0.60",
  "scipy>=1.14",
  "scikit-image>=0.25",
  "pillow>=10",
  "tifffile>=2024",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stardist-train = "stardist_minimal.train:main"
stardist-evaluate = "stardist_minimal.evaluate:main"
stardist-predict = "stardist_minimal.predict:main"

[tool.setuptools]
packages = ["stardist_minimal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
