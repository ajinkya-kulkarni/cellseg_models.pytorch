[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stardist-isolated"
version = "0.1.0"
description = "Minimal standalone 2D StarDist extraction from cellseg_models.pytorch"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "numba>=0.60",
  "scipy>=1.14",
  "scikit-image>=0.25",
  "timm>=1.0.7",
  "torch>=2.0,<3.0",
]

[project.optional-dependencies]
onnx = ["onnx", "onnxscript"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
